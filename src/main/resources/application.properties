spring.application.name=api-gateway-grupo01
server.port=8070

# registro en eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# rutas dinamicas balanceadas con eureka (spring cloud 2025 webflux)
spring.cloud.gateway.server.webflux.routes[0].id=pedido-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://PEDIDO-SERVICE-GRUPO01
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/pedidos/**

spring.cloud.gateway.server.webflux.routes[1].id=pago-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PAGO-SERVICE-GRUPO01
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/pagos/**

# alias tradicional para compatibilidad con rubrica
spring.cloud.gateway.routes[0].id=pedido-service-route-legacy
spring.cloud.gateway.routes[0].uri=lb://PEDIDO-SERVICE-GRUPO01
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/pedidos/**

spring.cloud.gateway.routes[1].id=pago-service-route-legacy
spring.cloud.gateway.routes[1].uri=lb://PAGO-SERVICE-GRUPO01
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/pagos/**
